text = "每次交付必须带六字段证据"
source = "A delivery carries its six fields of evidence"

[[rule]]
id = "budget-declared"
text = "不开一个没写预算的派单"
source = "Never open a dispatch without first naming its budget"

[[rule]]
id = "budget-free-checks"
text = "收尾套件的检查不计入预算"
source = "Checks that the closing suite requires are never counted against the budget"

[[rule]]
id = "budget-not-excuse"
text = "预算不许当作砍检查的理由"
source = "Never use a budget as a reason to cut a check that would otherwise be run"

[[rule]]
id = "two-objects"
text = "有限工作与长期能力永不混表"
source = "Two kinds of object, and never put them in one table"

[[rule]]
id = "cap-latest-reading"
text = "长期能力记最近一次真实读数，不记步号"
