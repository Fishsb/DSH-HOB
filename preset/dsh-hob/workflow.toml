# ── 交付与预算（⚠ 这些是"每轮都要执行"的，故进机读源）────────────
[[rule]]
id = "six-fields"
# ⚠ P17：本条的正文**不再在 `## 纪律` 里展开**（渲染成节首一行指针）——机读源保留，
#   ⛔ 删掉它会让 N-F7/N-F8/F1 失去对象。
