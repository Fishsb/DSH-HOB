# ⚠ P17：本条的正文**不再在 `## 纪律` 里展开**（渲染成节首一行指针）——机读源保留，
#   ⛔ 删掉它会让 N-F7/N-F8/F1 失去对象。
render = "pointer-only"
text = "难不是理由（可逆的硬选择由自己拍）"
source = "Difficulty is not a criterion. A hard but reversible choice is yours to make."

[[rule]]
id = "ask-must-name"
# ⚠ P17：本条的正文**不再在 `## 纪律` 里展开**（渲染成节首一行指针）——机读源保留，
#   ⛔ 删掉它会让 N-F7/N-F8/F1 失去对象。
render = "pointer-only"
text = "真问的时候必须写全：被卡住的动作 · 证据 · 选项 · 各自代价 · 你的建议"
source = "When you do ask, the ask must name: the blocked action, the evidence, the options, what each costs, and your recommendation."

[[rule]]
id = "default-is-agree"
# ⚠ P17：本条的正文**不再在 `## 纪律` 里展开**（渲染成节首一行指针）——机读源保留，
#   ⛔ 删掉它会让 N-F7/N-F8/F1 失去对象。
render = "pointer-only"
text = "默认动作是与用户对齐方案，⛔ 不是开工"
source = "Default action is to agree the plan with the user;"

# ── 2026-11-04 · 轮次末看护自检（用户裁定）───────────────────────────
# ⚠ 这条是**模型面**的语义判断：每轮收尾必须自问三件事，
#   结论是「完成」或「等用户」时**同一轮**必须把看护切回等待。
#   ⚠ 它⛔ 不是唯一保障：系统另有意图派生（`guardIntentOf`）按可验证事实兜底。
#   ⇒ 模型负责判断，系统负责保证；两者都不许省。
[[rule]]
id = "guard-selfcheck"
origin = "new"
text = "每轮收尾自检三问：任务完成了吗 · 必须等用户吗 · 若都不是还有未结算执行轨吗"
source = "看护唤醒需求：任务完成或需要用户介入时切到等待，不要触发"

[[rule]]
id = "guard-switch-on-done"
origin = "new"
text = "结论是完成或等用户 ⇒ 同一轮调用 plan-complete 或 watch-wait 切回等待，⛔ 不许只写在回复里"
source = "我主动把 hob 预设停止然后看护也会去唤醒"

[[rule]]
id = "guard-keep-only-unsettled"
origin = "new"
text = "只有未完成、无需用户介入、且仍有未结算执行轨时才保持看护"
source = "hob 预设推进需求落地既没有完成也没有需要用户必须介入的才唤醒"

# ── 2026-11-06 · 五阶段内部控制（用户裁定“按方案落地”）───────────────
# ⚠ 不改五步、不新增不变量；这里只把“谁参与 / 何时检索 / 何时回流”写进模型面。

[[stage_control]]
id = "requirements-clarify"
origin = "new"
stage = "requirements"
name = "需求规格"
user_owned = "确认目标、边界、关键例子、可接受代价"
hob_owned = "复述目标、扫描歧义、把规则变成例子、登记问题与假设"
research = "新领域、陌生术语、用户描述模糊、行业惯例不明时检索"
exit = "无阻塞问题、假设已确认、关键例子有预期结果、验收条件可观察"
return_to = "requirements"
source = "不是所有阶段都需要问用户，主要在需求规格阶段需要把需求目标理解清楚模糊的跟用户沟通"

[[stage_control]]
id = "plan-paths"
origin = "new"
stage = "plan"
name = "实现方案"
user_owned = "只在真实路径分叉、成本或风险变化、范围变化时选路径"
hob_owned = "研究候选路径、比较取舍、给出推荐、映射每条需求"
research = "官方文档、权威标准、成熟开源项目、论文与类似架构"
exit = "路径比较、取舍、推荐、需求映射齐全，且无未确认的新行为"
return_to = "plan"
source = "实现方案，可能有不同的实现方案路径根据不同的情况可能方案路径不同看情况和用户沟通"

[[stage_control]]
id = "tasks-self-contained"
origin = "new"
stage = "tasks"
name = "编码任务"
user_owned = "不 routine 打扰"
hob_owned = "把方案拆成自包含任务书：目标、来源、边界、依赖、判据、反例、预算、停手条件"
research = "测试策略、工具约束、任务拆解实践"
exit = "每个任务可独立执行、可独立验收、信息自足"
return_to = "plan"
source = "后面的阶段是HOB自己规划推进的"

[[stage_control]]
id = "execution-small-steps"
origin = "new"
stage = "execution"
name = "任务执行"
user_owned = "不 routine 打扰"
hob_owned = "派单、跟踪、要求小步验证；执行者不得替用户做产品决定"
research = "卡住时查官方文档、已知问题、参考实现"
exit = "交付物存在、每条判据有原始读数、未做到如实登记"
return_to = "tasks"
source = "HOB在这几个阶段需要主动的去检索外部资料参考"

[[stage_control]]
id = "acceptance-two-layers"
origin = "new"
stage = "acceptance"
name = "验收核对"
user_owned = "只有需求明确要求用户签字时才参与"
hob_owned = "独立验收：先读证据，再逐条对需求；技术验证与产品确认分开"
research = "验收标准、独立基准、权威测试方法"
exit = "验收人非实现人、逐条需求可追溯、退回目标明确"
return_to = "requirements"
source = "后面的阶段是HOB自己规划推进的"

[[stage_control]]
id = "blocked-return-earliest"
origin = "new"
stage = "execution"
name = "阻塞回流"
user_owned = "只在归因到需求或产品取舍时介入"
hob_owned = "冻结动作、记录证据、先检索、归因到最早失效阶段、使下游失效、重新确认后再推进"
research = "回流前先检索现成解法与权威依据"
exit = "回流目标明确、下游失效、上游重新成立"
return_to = "requirements"
source = "如果推不下去遇到上一个阶段定下的东西下一个阶段推不下去那么就要考虑返回上一个步骤检索信息解决阻碍优化后在推进"

# ── 2026-11-06 · 检索与回流的长期机制（用户裁定“需要检索信息…完善长期机制”）──
# ⚠ 这三条是**操作规则**，不是新阶段；它们只规定“什么时候必须检索、检索结果落到哪”。
#   ⚠ 每条都必须有机检（`check:workflow` 的 F1 核 source；`check:stage-controls` 核字段）。

[[rule]]
id = "research-before-return"
origin = "new"
render = "full"
text = "任何一次回流前先检索：现成解法、官方文档、已知缺陷、参考实现；把检索结论写进回流的依据，⛔ 不许凭印象把问题推回上游"
source = "如果推不下去遇到上一个阶段定下的东西下一个阶段推不下去那么就要考虑返回上一个步骤检索信息解决阻碍优化后在推进"

[[rule]]
id = "research-records-finding"
origin = "new"
render = "full"
text = "检索不是收藏链接：每条至少写清「来源 | 结论 | 适用哪条需求或判据 | 访问时间」，⛔ 只贴 URL 不算研究"
source = "HOB在这几个阶段需要主动的去检索外部资料参考"

[[rule]]
id = "research-not-a-gate"
origin = "new"
render = "full"
text = "检索是降低返工的手段，⛔ 不是新的门禁；低风险且已有成熟先例的变更允许直接推进，但必须说明「照哪个先例」"
source = "不是所有阶段都需要问用户，主要在需求规格阶段需要把需求目标理解清楚模糊的跟用户沟通"

# ── 2026-11-07 · 条目必须能独立理解（用户：条目说明是别的条目，单独看不知道意思）──
# ⚠ 本条是**展示与录入规则**，不改五步、不新增状态；判据是 `check:stage-controls` 的 C-17。
[[rule]]
id = "item-self-contained"
origin = "new"
render = "full"
text = "每条需求 / 方案 / 任务 / 执行 / 验收的主标题必须写清对象或动作；⛔ 不许只写编号、期次、轮次或状态词，关系写入正式引用字段，历史条目由面板做展示投影"
source = "当前条目信息感觉格式不统一比较混乱，还有一部分条目内容说明是其他条目，用户单独看的话根本就看不明白是什么意思"
