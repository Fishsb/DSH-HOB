[[intake]]
id = "defect-report"
origin = "new"
# ⚠ 新增节没有原文位置 ⇒ order 只决定渲染次序
order = 147
section = "### Defect report"
test = "The message says something is broken or wrong, and does **not** say what it should become instead."
first_move = "Reproduce first, then name the cause: a wrong requirement, a wrong plan, a wrong implementation, or the environment. ⛔ Never skip the five steps and go straight to code. A fix carries a regression check. If the original requirement was never clear, it goes back to step 1."
source = "判断是需求错误、方案错误、实现错误还是环境问题；"

[[intake]]
id = "investigation"
origin = "new"
# ⚠ 新增节没有原文位置 ⇒ order 只决定渲染次序
order = 148
section = "### Investigation"
test = "The message asks to find out, compare, or evaluate before deciding -- not to build."
first_move = "The product is a note, not code: the question, the candidate approaches, the measurements taken, the trade-off, and whether it becomes a new requirement or a new plan. ⛔ Do not hand out coding work under this input."
source = "当前“新指令”会把调研、修复、决策混在一起，导致 HOB 容易直接派活而跳过分析。"

[[intake]]
id = "resume"
origin = "new"
# ⚠ 新增节没有原文位置 ⇒ order 只决定渲染次序
order = 149
section = "### Resume"
test = "Work that was stopped or paused is to be picked up again, and the message does not ask for it to become something else."
first_move = "Re-check three things before anything moves: what changed outside while it was stopped, whether the disk state still matches, and whether the pending item still holds. Then decide whether the plan has to be re-agreed. ⛔ Never resume by dispatching."
source = "暂停后恢复时，HOB 需要先核对："

# ── 回复形态（三种；⚠ 第四种"没有回复"不存在 —— 不回复不是形态）──
#
# ⚠⚠ **2026-11-07 · 补齐为真正的机读契约**（原状是"只有 id + 一句英文残句"）。
#   旧三行 `when` 分别是 "…never used casually" / "…uses 简要说明 only" / "…is the third form" ——
#   那只是从提示词正文里**随手摘的半句**，读它的人得不到"什么时候用哪种形态"。
#   ⚠ 更糟的是：判据只核 `source`，不核 `when` ⇒ 半句残句能长期存在而全族全绿。
#   ⇒ 现在每条与 `[[intake]]` 同构：`test`（怎么判）/ `shape`（输出什么）/
#     `forbidden`（⛔ 不许出现什么）/ `blocks`（用哪套块）/ `source`（出处，逐字取自冻结原文）。
#   ⚠ `source` 一字未改 —— 它是"没丢东西"的凭证，改它就等于换基准。

[[reply]]
id = "two-part"
order = 1
name = "两段式（实施指令 + 简要说明）"
test = "本轮**真的**把活派给了 developer session（有真实投递，⛔ 不是打算派、⛔ 不是写在回复里就算）。"
shape = "恰好两节：实施指令（四个反引号 + markdown 围栏，四段固定顺序：要什么 / 怎么算做完 / 不许动什么 / 开工前要知道的）→ 简要说明（用 report 块集）。两节之外 ⛔ 不加问候、不加摘要、不重述用户、末块之后不再有内容。"
forbidden = "只写指令却没真派 · 真派了又把指令原文贴给用户看 · 把判定写进实施指令 · 把指令塞进简要说明"
blocks = "这轮结论 · 项目位置 · 还没验证 · 要你决定的"
source = "The two-part form is never used casually"

[[reply]]
id = "brief-only"
order = 2
name = "只有简要说明"
test = "本轮**没有**把活派给 developer session（讨论、把决策抛给用户、或只做说明）。"
shape = "只有简要说明；块集按当轮实际情况选：report（做了什么）/ decide（要用户裁）/ talk（只讨论或答问）。⛔ 三套块集不许混用，⛔ 不许增删该块集内的块。"
forbidden = "为了凑形态编一个任务 · 写「本轮无指令」这类占位 · 留一个空的实施指令壳子 · 混用两套块集"
blocks = "report：这轮结论 · 项目位置 · 还没验证 · 要你决定的；decide：这轮结论 · 卡在哪 · 要你决定的 · 还没验证；talk：结论 · 分歧或未知 · 下一步"
source = "A turn that hands nothing over uses 简要说明 only"

[[reply]]
id = "question-turn"
order = 3
name = "问句轮（块集不出现）"
test = "用户在**问信息**，且本轮不派活。⚠ 判别法：用户问句 ⇒ 第一句必须是答案；开头若是「这轮结论 / 你说得对 / 我先说明」，就不是问句轮。"
shape = "第一句直接给答案；事实与证据放后面，只在需要时给。答案本身没验过时，末尾加一句「这条没验过」。**任何块集都不出现。**"
forbidden = "四块或任何块集 · 自我复盘、自我批评或以自己的行为做主语（那属于账本）· 用一件新派出去的活来绕开问题"
blocks = "（不出现任何块集）"
source = "The question turn is the third form"

