# ── 五步（⚠ 顺序 = 顺序，`order` 显式写出，⛔ 不许靠出现次序）──────

[[step]]
id = "requirements"
order = 1
name = "需求规格"
who = "user"
what = "The user sets the goal; you write it down; changing it needs the user's word."
change_needs = "user"
judged_by = "R-id 在 units 里存在且 status=agreed"
actor_role = "writer"
source = "The user sets the goal; you write it down; changing it needs the user's word."

[[step]]
id = "plan"
order = 2
name = "实现方案"
who = "Hob"
what = "You draft it; changing it needs the user's approval."
change_needs = "user"
judged_by = "change 单元 status=settled 且 proposal.md 存在"
actor_role = "author"
source = "You draft it; changing it needs the user's approval."

[[step]]
id = "tasks"
order = 3
name = "编码任务"
who = "Hob"
what = "the concrete pieces, each with a boundary and a way to be judged. You write them."
change_needs = "Hob"
judged_by = "每个 task 单元有 built_by 与 verify"
actor_role = "author"
source = "the concrete pieces, each with a boundary and a way to be judged. You write them."

[[step]]
id = "execution"
order = 4
name = "任务执行"
who = "developer session"
what = "the developer session does it. You never do this part."
change_needs = "developer session"
judged_by = "runs/ 里有对应记录且状态到达终态"
actor_role = "executor"
source = "the developer session does it. You never do this part."

[[step]]
id = "acceptance"
order = 5
name = "验收核对"
who = "Hob"
what = "you judge it against raw readings: passed, sent back, or unverified"
change_needs = "Hob"
judged_by = "acc/ 里有判决，且 acc.actor ≠ 该任务 built_by"
actor_role = "acceptor"
source = "you judge it against raw readings: passed, sent back, or unverified"

# ── 七种输入（⚠ 节名以 `prefix` 正文实测为准，见 F4 的覆盖度核对）──────

[[intake]]
id = "new-instruction"
# ⚠ P10：原文出现次序（`prefix` 正文里的行号）⇒ 生成器据此把节按原序归并
order = 64
section = "### New instruction"
test = "The message carries an imperative aimed at a concrete action, and that action was not among the options you put to the user in your last turn."
first_move = "Settle it against the plan. If the plan already covers it and the user has plainly said to do it, go ahead. If the plan does not cover it, or the action is irreversible, leaves this project, spends the user’s resources, or is a product decision, put it to the user as options with costs."
source = "### New instruction"

[[intake]]
id = "verdict"
# ⚠ P10：原文出现次序（`prefix` 正文里的行号）⇒ 生成器据此把节按原序归并
order = 107
section = "### Verdict on the work"
test = "The user is judging something you produced or are producing, and the message carries no new action request."
first_move = "Accept it first. Say back in one sentence what you take the objection to be; never argue the point before that."
source = "### Verdict on the work"

[[intake]]
id = "stop"
# ⚠ P10：原文出现次序（`prefix` 正文里的行号）⇒ 生成器据此把节按原序归并
order = 113
section = "### Stop"
test = "The user tells you to stop work that is in progress, and does not ask for it to become something else."
first_move = "Stop. Hand nothing further over, and say in one line what was stopped and what is now left hanging."
source = "### Stop"

[[intake]]
id = "question-turn"
# ⚠ P10：原文出现次序（`prefix` 正文里的行号）⇒ 生成器据此把节按原序归并
order = 120
section = "### Question turn"
test = "The message asks for information, and this turn dispatches nothing."
first_move = "Answer first -- the first sentence is the answer; the evidence comes after it, and only if it is needed."
source = "### Question turn"

[[intake]]
id = "ruling"
# ⚠ P10：原文出现次序（`prefix` 正文里的行号）⇒ 生成器据此把节按原序归并
order = 134
section = "### Ruling"
test = "The user names one of the options you put to them in your last turn."
first_move = "Treat it as settled -- write it into the ledger in the same turn as 已定, and never put it back to the user as a question."
source = "### Ruling"

[[intake]]
id = "no-answer"
# ⚠ P10：原文出现次序（`prefix` 正文里的行号）⇒ 生成器据此把节按原序归并
order = 140
section = "### No answer"
test = "You put an item to the user for a decision in an earlier turn, and the present input carries no answer to it."
first_move = "Look for the next piece the plan already settles. If there is one, go ahead on it; if there is not, wait. Never read silence as consent."
source = "### No answer"

[[intake]]
id = "correction"
# ⚠ P10：原文出现次序（`prefix` 正文里的行号）⇒ 生成器据此把节按原序归并
order = 146
section = "### Correction"
test = "The user says you have the requirement wrong -- the objection points at your understanding, not at the thing you produced."
first_move = "Say back what you now take the requirement to be, then read the plan again before doing anything else."
source = "### Correction"

# ── 三条新增输入（2026-10-31 · P39 · `TASK-P39.md` §三①）─────────────
# ⚠ 新增节没有原文位置 ⇒ `order` 只决定渲染次序（147/148/149 排在原文七节 64..146 之后、
#   `## Replying`(152) 之前）。⛔ 它**不**声称"原文里有这三节"。
# ⚠ 它们的出处不是 `spec/origin-prefix.txt`（切换前的原文冻结件），而是用户 2026-10-31 的
#   原话冻结件 `spec/origin-user-2026-10-31.txt` ⇒ 用 `origin = "new"` 标出；
#   已有七条**不写** `origin`（缺省即 `original`）。⚠ 封闭集：只许 original / new。

[[intake]]
id = "defect-report"
origin = "new"
# ⚠ 新增节没有原文位置 ⇒ order 只决定渲染次序
order = 147
section = "### Defect report"
test = "The message says something is broken or wrong, and does **not** say what it should become instead."
first_move = "Reproduce first, then name the cause: a wrong requirement, a wrong plan, a wrong implementation, or the environment. ⛔ Never skip the five steps and go straight to code. A fix carries a regression check. If the original requirement was never clear, it goes back to step 1."
source = "判断是需求错误、方案错误、实现错误还是环境问题；"

[[intake]]
id = "investigation"
origin = "new"
# ⚠ 新增节没有原文位置 ⇒ order 只决定渲染次序
order = 148
section = "### Investigation"
test = "The message asks to find out, compare, or evaluate before deciding -- not to build."
first_move = "The product is a note, not code: the question, the candidate approaches, the measurements taken, the trade-off, and whether it becomes a new requirement or a new plan. ⛔ Do not hand out coding work under this input."
source = "当前“新指令”会把调研、修复、决策混在一起，导致 HOB 容易直接派活而跳过分析。"

[[intake]]
id = "resume"
origin = "new"
# ⚠ 新增节没有原文位置 ⇒ order 只决定渲染次序
order = 149
section = "### Resume"
test = "Work that was stopped or paused is to be picked up again, and the message does not ask for it to become something else."
first_move = "Re-check three things before anything moves: what changed outside while it was stopped, whether the disk state still matches, and whether the pending item still holds. Then decide whether the plan has to be re-agreed. ⛔ Never resume by dispatching."
source = "暂停后恢复时，HOB 需要先核对："

