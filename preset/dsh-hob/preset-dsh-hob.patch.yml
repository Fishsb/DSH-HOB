          # ⇒ **5 个里没有一个既"与本项目规划侧相关"又"在 Hob 现有工具面下可用"**。
          #   故按任务书 §2.1「收窄到明确挑选的目录」实现为：**关掉默认根、目录清单留空**
          #   ⇒ **那 5 个全部不可见**（逐名清单与分类另见回报第 3/4 段）。
          # ⚠⚠ **实测读数更正（本批实测；别照抄我原先的推断"生效技能 = 0 个"）**：
          #   收窄后生效技能**不是 0 个，而是 1 个：`dsh-interconnect`**。
          #   它**不来自任何文件系统发现根** —— 是 `dsh-interconnect` 这个**插件自己注册的
          #   provider**（`ctx.skills.registerProvider`）⇒ `includeDefaultRoots: false`
          #   **挡不住它**。⇒ 本行的准确效果 = **`~/.dsh/skills/` 那 5 个全部挡掉 +
          #   插件自带的仍可见**。要挡 `dsh-interconnect` 须另议（本批**不动**）。
          # ⚠ **对照实测**（隔离实例，同一 cwd，两次跑）：
          #   · **不写 `config`**（= 照抄宿主 standard）⇒ **6 个**：
          #     `arch-view` · `auto-task` · `cg-web-accessibility` ·
          #     `cg-web-lighthouse-optimizer` · `frontend-design` · `dsh-interconnect`；
          #   · **写本收窄** ⇒ **1 个**：仅 `dsh-interconnect`。
          #   ⇒ 收窄**确实生效**（5 → 0 个文件系统技能），且**未动 `~/.dsh/**` 一个字节**。
          # ⚠ 机制依据（`dsh-skill-filesystem/lib/index.js` 的 `roots()`）：默认根有**两处**，
          #   各自被 `includeDefaultRoots` 把守 ——
          #     `if (this.includeDefaultRoots && cwd !== undefined)` ⇒ 项目根
          #       （`<projectRoot>/.dsh/skills` 与 `.agents/skills`，本项目**两者皆空**）；
          #     `if (this.includeDefaultRoots)` ⇒ 用户根
          #       （`join(this.dshHome,'skills')` 与 `<agentsHome>/skills`，即那 5 个）。
          #   关掉它 ⇒ 文件系统 provider 只余 `customSkillDirs`（空）⇒ **无文件系统发现根**。
          #   ⚠ 但 `bundledSkillDir` **另有一条旁路**：`:84-85` 的
          #     `config.bundledSkillDir ?? (includeDefaultRoots ? process.env.DSH_BUNDLED_SKILL_DIR : void 0)`
          #     —— 本预设**未设**该键，环境变量也未设 ⇒ 本次实测它**未**贡献技能；
          #     `dsh-interconnect` 那条来自**独立 provider**，与此无关。
          # ⚠ **这是"机制已就位、清单留空"，不是"能力不可用"**：将来要放某个技能，
          #   只需往 `customSkillDirs` 里加**明确挑选的目录**，**不必改本行结构**。
          # ⛔ 本批**未改动也未删除 `~/.dsh/**` 下任何技能目录**（硬边界）。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs: []
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── O2 · 压缩（⚠ **必须**隔离 `compaction`；本预设用「共享 realm 标签」而非组）──
          # ⚠⚠ **实测硬约束（本批最重要的一处偏离，见回报第 4 段）**：
          #   ① **裸声明**（两行就地单行、无 `isolate`）⇒ 预设**根本挂不上**：
          #      `agentPresets.mount` 抛
          #        `Preset services require isolate realms: compaction`
          #      ⇒ 该预设被标 `broken` ⇒ **在选择器里被静默过滤掉**（E-21 的形态复现）。
          #      机制依据：`dsh-agent-preset-registry/lib/index.js:123-137` 的 `leakedServices()`
          #      —— 预设挂载时逐个检查"挂在本次挂载 fiber 内、且用的是**根 realm** 的 key 的
          #      服务"，有一个就抛。`compaction` 是 `Service` 子类
          #      （`dsh-compaction/lib/index.js:169-171` 的 `super(ctx, "compaction")`），
          #      裸声明 ⇒ 用根 key ⇒ **被判泄漏**。
          #   ② **只给叶子加 `compaction: true`**（各建各的 realm）⇒ 也挂不上：
          #      `command-compact (@deepseek-ai/dsh-command-compact): waiting for compaction`
          #      —— 叶子级 `true` 给**每一行各开一个新 realm**，于是两者**互相看不见**。
          #   ③ **共享一个 realm 标签**（下面这个写法）⇒ **通过**。依据：组合参考的规则
          #      「`isolate` maps service names to `true` or a realm label; a preset plugin
          #      that provides a service isolates the provider **and all consumers together**」
          #      —— 同一个**标签串**即同一个 realm ⇒ 提供者与消费者同在，`leakedServices`
          #      不再命中，`command-compact` 也能拿到 `compaction`。
          #   ⇒ 用 `b13realm` 这个**本预设自己的**标签（**不与宿主共用 realm 名**，
          #     免得两边互相影响；宿主的组用的是 `true`，语义上不同）。
          # ⚠⚠ **为什么不用宿主的「组 + isolate」写法**（`standard.patch.yml:63-79`）：
          #   那会引入一个**分组容器行**（`group: true`）⇒ **撞本项目既有的 ⑤f 断言**
          #   （`DECL_BANNED` 含该组名，且另有"零分组容器行"独立断言）。
          # ⚠ 注：本文件里**连写出那两行的字面串都会**踩中 ⑤f —— 它的匹配**不剔注释**
          #   （与 ⑤f 里"声明行"那条不同，那条已剔）。故此处**故意不写全**。
          #   任务书 §6.5 明令「**不得放宽任何既有断言**」⇒ 组这条路**走不通**，
          #   共享 realm 标签是**同时满足"能挂载"与"不放宽断言"**的写法（实测两者皆过）。
          # ⚠ **未 isolate `toolResultPruner`**（宿主那份有）：本预设**没有**
          #   `tool-result-pruner` 行 —— 用户裁定不做 ⇒ 不 isolate 它。
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            isolate:
              compaction: b13realm
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
            isolate:
              compaction: b13realm

          # ── O5 · 只取 `present` ──────────────────────────────────────────────
          # ⚠ `todo_write` / `job_*` **本批不加**（用户只选 present）。
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ══ 本插件的工具行（未随批 9 / 批 13 改动）══════════════════════════
          # ── 权限收敛面：**一行**，恰好两个工具（read_contracts / write_hob）──
          # ⚠ 只能写一行：本模块在一个 `apply` 里注册两个工具，写成两行会在同一个
          #   preset 作用域里把同名工具注册两次（旧项目实测，见 EXPERIENCE E-22）。
          # ⚠ 必须补 `package.json` 的 `exports["./preset/tools"]`，否则预设行
          #   `never started` ⇒ 该预设带 `broken` ⇒ **在选择器里被静默过滤掉**
          #   （旧项目实测，见 EXPERIENCE E-21）。
          # ⚠ 本行的模块**不在插件作用域**注册工具（那会漏进每个预设）——
          #   它只在**预设作用域**注册；工具的**实现**来自 `src/modules/tools.ts`
          #   （唯一一份），并经门禁服务 `hobTools` 判断 `modules.tools` 是否开启。
          - id: tool-hob-contracts
            name: 'dsh-hob/preset/tools'
            config:
              workspaceRoot: ''
              # v4：账本已迁出工作区，按工作区名派生（每个工作区独立、物理隔离）。
              #
              # ⚠ **现已显式配置** `ledgerHome`（不再是缺省）。落点 `~/.dsh/hob-ledgers`
              #   —— 其下**每个工作区一个独立仓**：<ledgerHome>/<工作区名>/，
              #   且该目录**自己就是仓根**（不再是"一个父仓管多个工作区"）。
              #   · /home/lk/FF/dsh-hob → /home/lk/.dsh/hob-ledgers/dsh-hob（独立仓根）
              #   ⚠ **代价**：该值是**本机绝对路径** ⇒ **放弃"不含本机绝对路径"的
              #     可移植性口径（UD-73③）**，换机器/换用户**须重配**此值。
              #   ⚠ 沿革：曾用「工作区的**兄弟目录**」缺省
              #     （<工作区父目录>/.hob-ledgers/<工作区名>/，不含本机绝对路径）；
              #     更早曾写死 `/home/lk/FF/.hob-ledgers`，实测在新环境会把账本写到
              #     **上一台机器的路径**上（2026-10-08 重启后复核发现，已修正）。
              #     2026-10-09 按 **UD-86 / UD-87** 改为显式配置 `~/.dsh/hob-ledgers`。
              #   要再改父目录就在此处改 `ledgerHome`（或给 `ledgerRoot` 直接指定）。
              ledgerHome: /home/lk/.dsh/hob-ledgers
              # ⚠ ⚠ **写侧可写面里有一处「两层」—— 新增这类目录时的动作（2026-10-15 第 213 轮 · UD-116）**
              #   `write_hob` 的白名单在 `src/server/hob-write.ts`：账本根那几份 + `archive/<日期>/` 一层
              #   + `volumes/<卷>/` **一层**；⚠ 另有 `VOLUME_SUBDIRS` —— **卷下具名两层目录**清单
              #   （当前 = `context/rounds`，即第 210 轮按 UD-114 换的「一轮一文件」载体）。
              #   ⚠ ⚠ **下次再出现一个新的两层目录 ⇒ 动作 = 把它的相对路径（如 `context/rounds`）加进
              #   `VOLUME_SUBDIRS`（一行）**；⚠ **且有断言强制你登记**：`npm run check:gitignore` 的
              #   **Q 组**会扫账本区实际存在的 `<卷>/<子目录>/`，**未登记 ⇒ 当场 FAIL 并点名那条路径**
              #   ⇒ ⚠ **"只写成特例、下次再裂一次"这条路被机械堵住**（UD-115 的核心）。
              #   ⚠ 未登记的两层路径会被拒并附同一段指引（错误消息里就写着这四行）。
              maxFileBytes: 65536
              maxWriteBytes: 262144
              enableWrite: true
