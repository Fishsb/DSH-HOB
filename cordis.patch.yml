# dsh-hob 自带的 bundle patch —— **本文件属于插件，不是给 profile 用的**
#
# 它是什么：
#   package.json 的 `dsh.bundle.patch` 指向本文件。宿主加载本插件时，按
#   `join(packageDir, file)` 从**安装目录**读它，作为 bundle 层叠加进组合。
#   因此本文件随包分发，**不需要**在 exports 里暴露。
#
# 它不是什么（三个不同位置、不同用途的文件，别混淆）：
#   · 不是 profile 的用户 patch —— 那个在
#     `$DSH_HOME/profiles/<name>/cordis.patch.yml`。
#   · 不是家目录级 patch —— 那个在 `$DSH_HOME/cordis.patch.yml`（跨 profile 生效）。
#
# ⚠ 本包一旦进了 profile 的 `dsh.profile.bundles`（`dsh plugin add` 会自动追加），
#   **不要**再在 profile 的 cordis.patch.yml 里重复写 insert（那是冗余声明）。
#   profile 层写同 id 的条目是「**id 定向覆盖 config**」，不是重复挂载。
#
# 本轮为**最小声明**：先能加载、不写业务。
#
# ⚠ 本文件的 `config` 段必须与 `src/config.ts` 的 schema **一一对应**：
#   2026-10-06 配置面清理轮（UD-43）删掉了三个"空旋钮"字段（界面上有、
#   背后无功能），本文件里对应的赋值也已一并删除 —— 否则会留下
#   **指向已删字段的脏声明**（它随包分发到每个装了本插件的 profile）。
#   被删的是哪三个、为什么删：见 `.hob/EXPERIENCE.md` E-80。
#   ⇒ 通用纪律：**先**在 `src/config.ts` 里加/删字段，**再**回到这里同步；
#     任何情况下都别让本文件出现 schema 里没有的键。
#     （本条刻意**不写出**那三个键名 —— 写了就会让"本文件里这些键零命中"
#       这条判据被注释自己破坏，见 E-71。键名在 E-80 里有。）
- insert:
    - id: dsh-hob
      name: dsh-hob
      config:
        modules:
          tools: true
          bus: true
          # ⚠ **缺省 false**（与其它三个不同，刻意如此）：闭环编排会**在被派发的
          #   会话跑完后自动唤醒派活方** ⇒ 一旦转起来会在用户看不到的时候持续
          #   投递/建会话/烧 token（用户 2026-10-09 选了"不设上限、只能手动停"）。
          #   ⇒ 默认不装：要用的人**显式打开**，且打开时就知道自己在开什么。
          #   关掉它只影响 M5：会话总线仍在（手工投递路不受影响）。
          orch: false
          settings: true
          # ⚠ **缺省 false**（2026-10-16 第 237 轮 · M6a · `UD-119` 裁定）：跨实例投递
          #   会**在无人看管时向另一个实例投递** ⇒ 与 `orch` 同风险档 ⇒ 显式打开。
          #   ⚠ 另有一条**独立**的闸门：**权限档位 = 账本时，即便这里开着也不提供投递服务**
          #     （跨实例投递是"影响外部状态"的动作，只读档不做）。
          #   ⚠ 关掉它只影响 M6a：投递服务不提供，其余模块照常。
          interconnect: false
        # ── 新建会话默认值（2026-10-09 本轮新增；与 src/config.ts 的 `spawn` 段一一对应）──
        # ⚠ 四个字段**都带 .volatile()** ⇒ 运行时都是 **ref 对象**，
        #   唯一允许解 ref 的地方是 `src/config.ts` 的 `spawnDefaults()`；
        #   调用方（`src/modules/bus.ts` 的 spawn）一律不许直接读 `config.spawn.x`。
        # ⚠ 空串 = **用宿主默认**（预设 = 宿主默认预设；模型 = 宿主默认模型；
        #   档位 = 该模型自身默认档）。只影响**本插件建出的会话**，
        #   不影响用户在宿主界面里手工新建的会话。
        # ⚠ 设置面写入必须走**子字段路径**（如 `['spawn','provider']`）——
        #   父对象 `spawn` 自己不 volatile，宿主 `isVolatilePath` 会拒整块写。
        spawn:
          agentPreset: ""
          provider: ""
          model: ""
          reasoningEffort: ""
        # ── 权限档位（2026-10-14 第 144 轮新增；与 src/config.ts 的 `permission` 段一一对应）──
        # ⚠ 与 `spawn` **同形**：父对象 `permission` 自己不 volatile，子字段 `level` 带
        #   `.volatile()` ⇒ 设置面写入必须走**子字段路径** `['permission','level']`。
        # ⚠ 三个值 = 包含链里的三档（账本 ⊂ 项目 ⊂ 工作区）：
        #   账本 = 只读自己的账本 + 网络（**默认**）；项目 = 另可读工作区的 `.md`
        #   文档、不可读代码；工作区 = 另可读工作区的文档与代码（文本类）、
        #   可跨文件搜索、可读图片。
        # ⚠ **任何一档都不能改动**：写类 / 命令类工具在三档里都不存在
        #   （`src/preset/tools.ts` 的三档表 + 哨兵守着）。
        # ⚠ 它带 `.volatile()` ⇒ 改档位走 volatile-only 通道、**不必重启**。
        permission:
          level: ledger
        # ── 「首次使用时铺骨架」（2026-10-16 第 224 轮 · `UD-118` 用户裁定「C」）──
        # ⚠ 它管的是：插件**首次**在某工作区干活时，把骨架（`.hob/**` 结构层）铺进去 ——
        #   ⚠ 免得"装到别的实例"这件事**依赖人记得复制**（由来：第 221 轮实测
        #   `npm pack` 里 `.hob/` 命中 0）。
        # ⚠ ⚠ **它不是 agent 的工具**：Hob 的工具面一个都不多（约束 ⑥）——
        #   ⛔ 别把它接到 `write_hob` 的入参上，也⛔ 别在预设里声明它；
        #   它是**插件的初始化行为**（与"注册模块"同一档）。
        # ⚠ **缺省 true（默认开）**：它**永不覆盖已存在的 `.hob/`**（只补缺）
        #   ⇒ 对已有骨架的工作区是**空操作**（只打一行"已存在 ⇒ 跳过"）。
        # ⚠ 形状与 `spawn` / `permission` 同形：父不标 volatile、子字段标
        #   （父子同标会抛 ValidationError；非 volatile 路径会被宿主写入通道拒）。
        # ⚠ 唯一允许解 ref 的地方是 `src/config.ts` 的 `skeletonEnabled()`。
        skeleton:
          enabled: true
        # ── 跨实例投递的对端白名单（2026-10-16 第 237 轮 · M6a · `UD-119` 裁定）──
        # ⚠ ⚠ **它是"⛔ 不做成能写任意远端"这条硬边界的载体**：对端地址**只从这里来**。
        # ⚠ 格式：每行一个对端 —— `名字` 或 `名字=<launcher 路径>`（⚠ 不给 launcher 就用缺省）。
        # ⚠ **空 = 谁都不许投**（⚠ 而拒的时候会**点名**说明"不在白名单内"，⛔ 不静默）。
        # ⚠ 形状与 `spawn` / `permission` / `skeleton` 同形：父不标 volatile、子字段标
        #   ⇒ ⚠ 改白名单**即改即生效**（⛔ 不必重启）；⚠ 写入走子字段路径。
        # ⚠ 唯一允许解 ref 的地方是 `src/config.ts` 的 `interconnectTargets()`。
        interconnectTargets:
          list: []
        # ── 「Hob 推进项目的工作方式」（2026-10-19 · `UD-97` 推进优先）────────────
        # ⚠ **它管什么**：**Hob 怎么拆活、拆成几路** —— 三档：自动 / 单会话 / 多会话。
        #   ⛔ **不管**：权限档位（那是上面的 `permission`）、谁能写什么、验收口径。
        #   ⇒ 与 `permission` 是**两个正交的旋钮**：一个管"看得见什么"，一个管"拆几路"。
        # ⚠ `auto`（缺省）/ `single` / `multi` —— 取值与顺序的**唯一来源**是
        #   `src/shared/work-mode.ts` 的 `WORK_MODE_VALUES`（⚠ 本文件只写声明值，
        #   ⛔ 不许在这里另立一套顺序；`check:config` 的 G 组双向比对）。
        # ⚠ 形状与 `spawn` / `permission` / `skeleton` / `interconnectTargets` 同形：
        #   父对象 `workMode` 不标 volatile、子字段 `mode` 标
        #   ⇒ ⚠ 设置面写入必须走**子字段路径** `['workMode','mode']`；
        #   ⚠ 父子同标会抛 `ValidationError`；非 volatile 路径会被宿主写入通道拒。
        # ⚠ **改完即生效、⛔ 不必重启**（volatile 原地更新；消费方每次装配现读档位）。
        # ⚠ 唯一允许解 ref 的地方是 `src/config.ts` 的 `workMode()`。
        workMode:
          mode: auto
# ⚠ 上面四个值只是**声明默认值**，别在代码里直接读 `config.modules.x`：
#   四个字段**都带 .volatile()** ⇒ 运行时都是 **ref 对象**（恒 truthy）。
#   唯一允许解 ref 的地方是 `src/config.ts` 的 `moduleSwitches()`。
#   ⚠ `bus` 自 **批 14 / M3** 起由 `false` 改 `true`（M3 已落地，投递真管用）；
#     同期它从"设置页刻意隐藏"改为**可见**（旧口径 UD-25 的前提已消失）。
#   ⚠ `orch` 是**批 17** 新增，**缺省 false** —— 理由见上（它会自己转）。
