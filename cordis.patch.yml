# dsh-hob 自带的 bundle patch —— **本文件属于插件，不是给 profile 用的**
#
# 它是什么：
#   package.json 的 `dsh.bundle.patch` 指向本文件。宿主加载本插件时，按
#   `join(packageDir, file)` 从**安装目录**读它，作为 bundle 层叠加进组合。
#   因此本文件随包分发，**不需要**在 exports 里暴露。
#
# 它不是什么（三个不同位置、不同用途的文件，别混淆）：
#   · 不是 profile 的用户 patch —— 那个在
#     `$DSH_HOME/profiles/<name>/cordis.patch.yml`。
#   · 不是家目录级 patch —— 那个在 `$DSH_HOME/cordis.patch.yml`（跨 profile 生效）。
#
# ⚠ 本包一旦进了 profile 的 `dsh.profile.bundles`（`dsh plugin add` 会自动追加），
#   **不要**再在 profile 的 cordis.patch.yml 里重复写 insert（那是冗余声明）。
#   profile 层写同 id 的条目是「**id 定向覆盖 config**」，不是重复挂载。
#
# 本轮为**最小声明**：先能加载、不写业务。
#
# ⚠ 本文件的 `config` 段必须与 `src/config.ts` 的 schema **一一对应**：
#   2026-10-06 配置面清理轮（UD-43）删掉了三个"空旋钮"字段（界面上有、
#   背后无功能），本文件里对应的赋值也已一并删除 —— 否则会留下
#   **指向已删字段的脏声明**（它随包分发到每个装了本插件的 profile）。
#   被删的是哪三个、为什么删：见 `.hob/EXPERIENCE.md` E-80。
#   ⇒ 通用纪律：**先**在 `src/config.ts` 里加/删字段，**再**回到这里同步；
#     任何情况下都别让本文件出现 schema 里没有的键。
#     （本条刻意**不写出**那三个键名 —— 写了就会让"本文件里这些键零命中"
#       这条判据被注释自己破坏，见 E-71。键名在 E-80 里有。）
- insert:
    - id: dsh-hob
      name: dsh-hob
      config:
        modules:
          tools: true
          preset: false
          bus: false
          settings: true
# ⚠ 上面四个值只是**声明默认值**，别在代码里直接读 `config.modules.x`：
#   其中三个带 .volatile() ⇒ 运行时是 **ref 对象**（恒 truthy），另一个不是。
#   唯一允许解 ref 的地方是 `src/config.ts` 的 `moduleSwitches()`。
#   （同理不点名是"哪三个"—— 与上面同一条判据纪律。）
